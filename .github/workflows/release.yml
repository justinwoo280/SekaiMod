name: Release Build
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag for the selected branch (e.g. v1.4.3)"
        required: true
      publish:
        description: "Set y to skip publishing the GitHub Release"
        required: false
      play:
        description: "Play: If want ignore"
        required: false
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Golang Status
        run: find buildScript libcore/*.sh | xargs cat | sha1sum > golang_status
      - name: Libcore Status
        run: git ls-files libcore | xargs cat | sha1sum > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v5
        with:
          path: |
            app/libs/libcore.aar
          key: ${{ hashFiles('.github/workflows/*', 'golang_status', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.10
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Test core and bundled lwIP
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: libcore
        run: |
          CGO_ENABLED=1 go test -count=1 -timeout=3m -tags "$(cat build_tags)" ./...
          CGO_ENABLED=1 go test -count=1 -timeout=3m -tags "$(cat build_tags)" -run '^TestLWIP' github.com/sagernet/sing-tun
      - name: Upload LibCore
        uses: actions/upload-artifact@v5
        with:
          name: libcore
          path: app/libs/libcore.aar
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download LibCore
        uses: actions/download-artifact@v5
        with:
          name: libcore
          path: app/libs
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Restore release keystore
        # Decode the base64-encoded keystore from repo secrets into a
        # workspace file. The decoded file lives only in the runner's
        # ephemeral filesystem and is not uploaded with the APK.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set; release build will fall back to debug signing." >&2
          else
            echo "$KEYSTORE_BASE64" | base64 -d > sekai-release.keystore
            echo "Restored sekai-release.keystore ($(wc -c < sekai-release.keystore) bytes)"
          fi
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
          # Authenticated GitHub API calls (assets.sh fetches latest
          # geoip / geosite release versions). Without this the
          # unauthenticated 60 req/h/IP limit is shared across all
          # public Actions runners and frequently returns no tag_name,
          # leading to a 404 on the empty-version download URL.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Release signing inputs consumed by buildSrc/Helpers.kt.
          # Setting KEYSTORE_PASS triggers the signingConfigs block,
          # which forces v1+v2+v3+v4 signature schemes for OEM
          # installer compatibility.
          KEYSTORE_FILE: sekai-release.keystore
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew --stacktrace app:testOssReleaseUnitTest app:assembleOssRelease
      - name: Verify OSS APK names
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties)
          dir=app/build/outputs/apk/oss/release
          shopt -s nullglob
          apks=("$dir"/*.apk)
          if [[ ${#apks[@]} -ne 4 ]]; then
            echo "::error::Expected four ABI APKs in $dir"
            exit 1
          fi
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            apk="$dir/SekaiMod-$version-$abi"
            if [[ ! -s "$apk.apk" && ! -s "$apk-unsigned.apk" ]]; then
              echo "::error::Missing SekaiMod APK for $abi"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v5
        with:
          name: APKs
          path: app/build/outputs/apk/oss/release/
          if-no-files-found: error
  publish:
    name: Publish Release
    if: github.event.inputs.publish != 'y'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          name: APKs
          path: artifacts
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != branch ]]; then
            echo "::error::Select the source branch (not a tag) for Release Build"
            exit 1
          fi
          version=$(sed -n 's/^VERSION_NAME=//p' nb4a.properties)
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Use the existing v$version tag for this build"
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG"
          if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $RELEASE_TAG must point at the commit used for this build"
            exit 1
          fi

          apks=()
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            apk="artifacts/SekaiMod-$version-$abi.apk"
            if [[ ! -s "$apk" ]]; then
              echo "::error::Missing release APK: $apk (check the release signing configuration)"
              exit 1
            fi
            apks+=("$apk")
          done
          gh release create "$RELEASE_TAG" "${apks[@]}" --verify-tag --target "$GITHUB_REF_NAME" \
            --title "SekaiMod $RELEASE_TAG" --generate-notes
  play:
    name: Build Play Bundle
    if: github.event.inputs.play != 'y'
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download LibCore
        uses: actions/download-artifact@v5
        with:
          name: libcore
          path: app/libs
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: ~/.gradle
          key: gradle-play-${{ hashFiles('**/*.gradle.kts') }}
      - name: Checkout Library
        run: |
          git submodule update --init 'app/*'
      - name: Gradle Build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_HOME}/ndk/25.0.8775105" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          ./run init action gradle
          ./gradlew --stacktrace bundlePlayRelease
      - uses: actions/upload-artifact@v5
        with:
          name: AAB
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
